<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324f"/><stop offset="1" stop-color="#3b6f95"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b86a6"/><stop offset="1" stop-color="#0a3a5c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#0e2237" opacity=".75">
    <ellipse cx="250" cy="90" rx="260" ry="55"/><ellipse cx="560" cy="60" rx="220" ry="48"/>
    <ellipse cx="980" cy="95" rx="300" ry="60"/><ellipse cx="1380" cy="60" rx="240" ry="50"/>
  </g>
  <!-- rain -->
  <g stroke="#a8d8ee" stroke-width="2" opacity=".35">
    <path d="M100 150l-14 40M220 120l-14 40M340 170l-14 40M460 130l-14 40M580 180l-14 40M700 120l-14 40M820 160l-14 40M940 130l-14 40M1060 180l-14 40M1180 120l-14 40M1300 160l-14 40M1420 130l-14 40M1540 175l-14 40M160 260l-14 40M400 280l-14 40M640 250l-14 40M880 290l-14 40M1120 260l-14 40M1360 285l-14 40"/>
  </g>
  <!-- city skyline -->
  <g fill="#0c2740">
    <rect x="60" y="330" width="90" height="230"/><rect x="170" y="280" width="70" height="280"/>
    <rect x="260" y="350" width="110" height="210"/><rect x="400" y="300" width="80" height="260"/>
    <rect x="520" y="370" width="120" height="190"/><rect x="680" y="310" width="70" height="250"/>
    <rect x="780" y="340" width="100" height="220"/><rect x="910" y="290" width="90" height="270"/>
    <rect x="1030" y="360" width="110" height="200"/><rect x="1170" y="320" width="80" height="240"/>
    <rect x="1280" y="350" width="120" height="210"/><rect x="1430" y="300" width="90" height="260"/>
  </g>
  <g fill="#ffb347" opacity=".55">
    <rect x="80" y="360" width="10" height="14"/><rect x="110" y="400" width="10" height="14"/>
    <rect x="190" y="320" width="10" height="14"/><rect x="210" y="380" width="10" height="14"/>
    <rect x="290" y="390" width="10" height="14"/><rect x="420" y="340" width="10" height="14"/>
    <rect x="700" y="350" width="10" height="14"/><rect x="930" y="330" width="10" height="14"/>
    <rect x="1200" y="360" width="10" height="14"/><rect x="1450" y="340" width="10" height="14"/>
  </g>
  <!-- flood water -->
  <path d="M0 500 Q200 470 400 500 T800 500 T1200 500 T1600 500 V700 H0Z" fill="url(#water)"/>
  <path d="M0 560 Q200 535 400 560 T800 560 T1200 560 T1600 560 V700 H0Z" fill="#0a3a5c" opacity=".7"/>
  <!-- rescue boat -->
  <g transform="translate(1000 478)">
    <path d="M0 40 H170 L150 70 H25Z" fill="#ff8a1f"/>
    <rect x="70" y="5" width="50" height="35" fill="#fff"/><rect x="82" y="14" width="26" height="12" fill="#00b8d9"/>
    <rect x="92" y="-18" width="4" height="23" fill="#fff"/><circle cx="94" cy="-20" r="5" fill="#e5383b"/>
  </g>
</svg>
